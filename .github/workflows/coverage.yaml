name: coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep a separate coverage run and its GitHub artifact for each main commit.
# A newer run for the same PR supersedes its earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Swatinem/rust-cache hashes CARGO*/RUST* into the cache key, so these track
  # ci.yaml (.github/AGENTS.md → Build environment).
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  code-coverage:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id != null && github.event.pull_request.head.repo.id == github.event.repository.id) }}
    runs-on: ubuntu-24.04
    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v7

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-llvm-cov
        version: "=0.9.1"

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.150"

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Own cache — coverage-instrumented builds differ from the shared test
        # cache. Already main-gated; cache-bin:false matches everywhere else.
        cache-bin: "false"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install shells (zsh, fish)
      run: sudo apt-get update && sudo apt-get install -y zsh fish

    - name: Install nushell
      uses: hustcer/setup-nu@v3
      with:
        version: '0.116.1'

    # Ensure nothing remains from caching
    - run: cargo llvm-cov clean --workspace

    - name: 📊 Generate coverage report
      # Match the regular suite's process isolation. Cargo's in-process runner
      # lets one busy PTY test delay another before it can paint its prompt.
      run: cargo llvm-cov nextest --features shell-integration-tests --cobertura --output-path=cobertura.xml

    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: cobertura.xml
