name: publish-docs
# Runner versions pinned; see ci.yaml header comment for rationale.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/cli/mod.rs'
      - '.github/actions/docs-build/**'
      - '.github/workflows/publish-docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/cli/mod.rs'
      - '.github/actions/docs-build/**'
      - '.github/workflows/publish-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id != null && github.event.pull_request.head.repo.id == github.event.repository.id) }}
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🕷️ Check and build docs
        uses: ./.github/actions/docs-build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/
          retention-days: 1

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-24.04

    # Don't attempt to publish if on a fork
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'max-sixty' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
