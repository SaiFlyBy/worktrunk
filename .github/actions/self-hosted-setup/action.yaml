name: Prepare dedicated Worktrunk Linux runner
description: Install the pinned Rust toolchain and minimal build dependencies in the owner-only runner.
runs:
  using: composite
  steps:
    - name: Check runner platform
      shell: bash
      run: |
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ARCH" = X64
    - name: Install native Rust dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Read checked-in Rust toolchain
      id: toolchain
      shell: bash
      run: |
        python - <<'PYTHON'
        import os, tomllib
        with open("rust-toolchain.toml", "rb") as source:
            toolchain = tomllib.load(source)["toolchain"]
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print("channel=" + toolchain["channel"], file=output)
            print("components=" + ",".join(toolchain.get("components", [])), file=output)
        PYTHON
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ steps.toolchain.outputs.components }}
