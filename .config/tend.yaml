# Tend 0.3.23 normal regeneration produces no agent workflows in this fork.
# Review later generator versions before using them.
# An explicit generator install-test option is separate and must not be used
# to restore automation without a deliberate review.
bot_name: worktrunk-bot
harness: codex
codex:
  auth_refresh: false
workflows:
