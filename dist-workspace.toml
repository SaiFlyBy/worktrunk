[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# CI backends to support
ci = "github"
# The installers to generate for each app
# Note: The shell/powershell scripts attempt to add the install directory to PATH by
# modifying shell config files (.profile, .bashrc, etc.), which can cause "Permission
# denied" errors on non-standard setups. This is cargo-dist's default behavior and
# reasonable for most users. Users with custom shell configs can set
# WORKTRUNK_NO_MODIFY_PATH=1 or install from a fork release archive instead.
# See: https://github.com/max-sixty/worktrunk/issues/590
# A fork-owned package registry or Homebrew tap has not been configured.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Staged from committed inputs by dev/stage-mission-control.ps1.
# The generated script installers still install binaries only; the full archive
# contains the Mission Control template and its attribution.
include = ["target/flyby-dist/flyby-integration"]
# Whether to install an updater program
install-updater = false
# Allow fork-specific CI modifications to the generated release workflow
allow-dirty = ["ci"]
# Enable git-wt binary in release builds (opt-in for cargo install)
features = ["git-wt"]
# Custom success message prompting shell integration
install-success-msg = "Run 'wt config shell install' for shell integration. For Mission Control, extract the full release archive."
